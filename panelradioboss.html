<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sikodark FM — Control Remoto</title>
  <style>
    * { margin: 0; padding: 0; font-family: sans-serif; box-sizing: border-box; }
    body { background: #1a1a2e; color: white; padding: 20px; max-width: 500px; margin: 0 auto; }
    .cancion { background: #16213e; padding: 25px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
    .artista { font-size: 18px; color: #aaa; margin-bottom: 5px; }
    .titulo { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
    .estado { color: #28a745; font-size: 14px; }
    .controles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    button { padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-verde { background: #28a745; color: white; }
    .btn-rojo { background: #dc3545; color: white; }
    .btn-azul { background: #007bff; color: white; }
    .siguiente { background: #0f3460; padding: 15px; border-radius: 8px; margin-top: 15px; }
    .etiqueta { font-size: 12px; color: #888; margin-bottom: 5px; }
  </style>
</head>
<body>

  <h2 style="text-align:center; margin-bottom:20px;">🎛️ Sikodark FM — Control Remoto</h2>

  <!-- Canción Actual -->
  <div class="cancion">
    <p class="etiqueta">AHORA SUENA</p>
    <p class="artista" id="artista">Cargando...</p>
    <h3 class="titulo" id="titulo"></h3>
    <p class="estado" id="estado">● Conectando...</p>
  </div>

  <!-- Botones de Control -->
  <div class="controles">
    <button class="btn-azul" onclick="enviar('prev')">⏮ Anterior</button>
    <button class="btn-verde" onclick="enviar('play')">▶ Play</button>
    <button class="btn-azul" onclick="enviar('next')">⏭ Siguiente</button>
    <button class="btn-verde" onclick="enviar('pause')">⏸ Pausa</button>
    <button class="btn-rojo" onclick="enviar('stop')">⏹ Stop</button>
    <button class="btn-azul" onclick="cargarInfo()">🔄 Actualizar</button>
  </div>

  <!-- Siguiente Canción -->
  <div class="siguiente">
    <p class="etiqueta">SIGUIENTE</p>
    <p id="sig-artista"></p>
    <p id="sig-titulo" style="font-weight:bold;"></p>
  </div>

  <!-- Oyentes -->
  <div style="margin-top:15px; text-align:center; color:#888;">
    👂 Oyentes: <span id="oyentes" style="color:white; font-weight:bold;">0</span>
  </div>

<script>
// ===== TU DIRECCIÓN DE NGROK =====
const API_URL = "https://canteen-sculpture-recoil.ngrok-free.dev";
const API_PASS = "siko123";

// ===== CONTROLES =====
async function enviar(comando) {
  try {
    await fetch(`${API_URL}/?pass=${API_PASS}&cmd=${comando}`);
    setTimeout(cargarInfo, 300);
  } catch (e) {
    alert("Error: " + e.message);
  }
}

// ===== CARGAR INFORMACIÓN =====
async function cargarInfo() {
  try {
    const res = await fetch(`${API_URL}/?pass=${API_PASS}&action=playbackinfo`);
    const texto = await res.text();

    // Canción actual
    const artistaAct = texto.match(/CurrentTrack[^>]+ARTIST="([^"]+)"/)?.[1] || "Sikodark FM";
    const tituloAct = texto.match(/CurrentTrack[^>]+TITLE="([^"]+)"/)?.[1] || "En vivo";
    const estado = texto.match(/Playback[^>]+state="([^"]+)"/)?.[1];
    const oyentes = texto.match(/Streaming[^>]+listeners="(\d+)"/)?.[1] || "0";

    // Siguiente canción
    const artistaSig = texto.match(/NextTrack[^>]+ARTIST="([^"]+)"/)?.[1] || "";
    const tituloSig = texto.match(/NextTrack[^>]+TITLE="([^"]+)"/)?.[1] || "—";

    // Mostrar en pantalla
    document.getElementById("artista").textContent = artistaAct;
    document.getElementById("titulo").textContent = tituloAct;
    document.getElementById("oyentes").textContent = oyentes;
    
    const estadoEl = document.getElementById("estado");
    if (estado === "play") {
      estadoEl.textContent = "● Reproduciendo";
      estadoEl.style.color = "#28a745";
    } else if (estado === "pause") {
      estadoEl.textContent = "⏸ En pausa";
      estadoEl.style.color = "#ffc107";
    } else {
      estadoEl.textContent = "⏹ Detenido";
      estadoEl.style.color = "#dc3545";
    }

    document.getElementById("sig-artista").textContent = artistaSig;
    document.getElementById("sig-titulo").textContent = tituloSig || "—";

  } catch (err) {
    console.error("Error:", err);
    document.getElementById("titulo").textContent = "Sin conexión";
  }
}

// ===== INICIO =====
cargarInfo();
setInterval(cargarInfo, 8000); // Actualiza cada 8 segundos
</script>
</body>
</html>
